<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('kley-theme');
        var theme = (saved === 'light' || saved === 'dark')
          ? saved
          : (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
        if (theme === 'light') document.documentElement.setAttribute('data-theme', 'light');
      } catch (e) {}
    })();
  </script>
  <title>Editor — KleySites</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png">
  <link rel="shortcut icon" href="/favicon.ico">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/src/styles/theme.css">
  <link rel="stylesheet" href="/src/styles/layout.css">
  <link rel="stylesheet" href="/src/styles/components.css">
  <link rel="stylesheet" href="/src/styles/editor/shell.css">
  <link rel="stylesheet" href="/src/styles/editor/topbar.css">
  <link rel="stylesheet" href="/src/styles/editor/sidebar.css">
  <link rel="stylesheet" href="/src/styles/editor/canvas.css">
  <link rel="stylesheet" href="/src/styles/editor/properties.css">
</head>
<body>

<div class="ed-shell">

  <header class="ed-topbar">
    <div class="ed-topbar-left">
      <button class="ed-icon-btn" id="btnVolverDashboard" title="Volver a Mis sitios">
        <div class="icon-frame icon-frame--20">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
        </div>
      </button>
      <div class="ed-topbar-divider"></div>
      <img src="/logo-kleysites.webp" alt="KleySites">
      <span class="ed-site-name" id="siteName">Mi sitio nuevo</span>
      <span class="ed-save-status" id="saveStatus"></span>
    </div>
    <div class="ed-topbar-right">
      <button class="ed-icon-btn" id="btnDeshacer" title="Deshacer (Ctrl+Z)" disabled>
        <div class="icon-frame icon-frame--20">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>
        </div>
      </button>
      <button class="ed-icon-btn" id="btnRehacer" title="Rehacer (Ctrl+Shift+Z)" disabled>
        <div class="icon-frame icon-frame--20">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M15 14l5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></svg>
        </div>
      </button>
      <div class="ed-topbar-divider"></div>
      <button class="ed-btn ed-btn--secondary">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s4-6 10-6 10 6 10 6-4 6-10 6-10-6-10-6z"/><circle cx="12" cy="12" r="2.5"/></svg>
        Vista previa
      </button>
      <button class="ed-btn ed-btn--primary">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20V5M12 5l-5 5M12 5l5 5"/><path d="M4 20h16"/></svg>
        Publicar
      </button>
    </div>
  </header>

  <div class="ed-body">

    <nav class="ed-rail">
      <div class="ed-rail-item" title="Páginas">
        <div class="icon-frame icon-frame--20">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6"/></svg>
        </div>
      </div>
      <div class="ed-rail-item" title="Plantillas">
        <div class="icon-frame icon-frame--20">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="7" rx="1"/><rect x="3" y="14" width="8" height="7" rx="1"/><rect x="13" y="14" width="8" height="7" rx="1"/></svg>
        </div>
      </div>
      <div class="ed-rail-item" title="Bloques">
        <div class="icon-frame icon-frame--20 is-active">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v16M4 12h16"/></svg>
        </div>
      </div>
      <div class="ed-rail-item" title="Tienda">
        <div class="icon-frame icon-frame--20">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2l1.5 4M18 2l-1.5 4"/><path d="M3.5 6h17l-1.2 12.5a2 2 0 0 1-2 1.8H6.7a2 2 0 0 1-2-1.8L3.5 6z"/><path d="M8 10a4 4 0 0 0 8 0"/></svg>
        </div>
      </div>
      <div class="ed-rail-item" title="Capas">
        <div class="icon-frame icon-frame--20">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 4.5-8 4.5-8-4.5z"/><path d="M4 12l8 4.5 8-4.5"/><path d="M4 16.5l8 4.5 8-4.5"/></svg>
        </div>
      </div>

      <div class="ed-rail-bottom">
        <button class="ed-rail-item ed-theme-toggle" data-theme-toggle title="Cambiar tema">
          <div class="icon-frame icon-frame--20 icon-sun">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          </div>
          <div class="icon-frame icon-frame--20 icon-moon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
          </div>
        </button>
        <div class="ed-rail-item" title="Ajustes">
          <div class="icon-frame icon-frame--20">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
          </div>
        </div>
        <div class="kley-account-wrap ed-account-wrap">
          <button class="ed-rail-account" id="btnCuentaEditor" title="Kleyder · tu cuenta">
            <div class="ed-avatar">K</div>
          </button>
          <div class="kley-menu kley-menu--up" id="menuCuentaEditor">
            <button class="kley-menu-item" disabled>Perfil <span class="kley-menu-soon">Próximamente</span></button>
            <button class="kley-menu-item" disabled>Configuración <span class="kley-menu-soon">Próximamente</span></button>
            <div class="kley-menu-sep"></div>
            <button class="kley-menu-item kley-menu-item--danger" data-accion="cerrar-sesion">Cerrar sesión</button>
          </div>
        </div>
      </div>
    </nav>

    <aside class="ed-panel">
      <div class="ed-panel-header">
        <span class="ed-panel-title">Bloques</span>
      </div>
      <div class="ed-widget-grid">
        <div class="ed-widget-card" data-tipo="imagen">
          <div class="icon-frame icon-frame--22">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8.5" cy="9.5" r="1.5"/><path d="M4 17l5-5 4 4 3-2 4 4"/></svg>
          </div>
          <span class="ed-widget-label">Imagen</span>
        </div>
        <div class="ed-widget-card" data-tipo="titulo">
          <div class="icon-frame icon-frame--22">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M6 4v16M18 4v16M6 12h12"/></svg>
          </div>
          <span class="ed-widget-label">Título</span>
        </div>
        <div class="ed-widget-card" data-tipo="texto">
          <div class="icon-frame icon-frame--22">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M5 6h14M12 6v13M9 19h6"/></svg>
          </div>
          <span class="ed-widget-label">Texto</span>
        </div>
        <div class="ed-widget-card" data-tipo="boton">
          <div class="icon-frame icon-frame--22">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="8" width="18" height="8" rx="4"/><path d="M8 12h8"/></svg>
          </div>
          <span class="ed-widget-label">Botón</span>
        </div>
        <div class="ed-widget-card" data-tipo="seccion">
          <div class="icon-frame icon-frame--22">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18"/></svg>
          </div>
          <span class="ed-widget-label">Sección</span>
        </div>
        <div class="ed-widget-card" data-tipo="columnas">
          <div class="icon-frame icon-frame--22">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="7" height="16" rx="2"/><rect x="14" y="4" width="7" height="16" rx="2"/></svg>
          </div>
          <span class="ed-widget-label">Columnas</span>
        </div>
        <div class="ed-widget-card" data-tipo="video">
          <div class="icon-frame icon-frame--22">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M10 9l5 3-5 3z"/></svg>
          </div>
          <span class="ed-widget-label">Video</span>
        </div>
      </div>
    </aside>

    <main class="ed-canvas-wrap">
      <div class="ed-page">

        <div class="ed-zone ed-zone--header" data-zona="encabezado">
          <div class="ed-zone-label">Encabezado</div>
          <div class="ed-zone-blocks" data-zone-blocks="encabezado"></div>
        </div>

        <div class="ed-zone ed-zone--content" data-zona="contenido">
          <div class="ed-zone-label">Contenido</div>
          <div class="ed-zone-blocks" data-zone-blocks="contenido"></div>
        </div>

        <div class="ed-zone ed-zone--footer" data-zona="pie">
          <div class="ed-zone-label">Pie de página</div>
          <div class="ed-zone-blocks" data-zone-blocks="pie"></div>
        </div>

      </div>
    </main>

    <aside class="ed-properties">
      <div class="ed-properties-header">
        <span class="ed-properties-title">Propiedades</span>
      </div>
      <div class="ed-properties-body" id="propertiesBody"></div>
    </aside>

  </div>

</div>

<script type="module" src="/src/js/theme.js"></script>
<script type="module" src="/src/js/editor/canvas.js"></script>
</body>
</html>
